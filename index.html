<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ray-Ban Auto Detect Translate V3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;width:600px;height:600px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.hud{width:600px;height:600px;background:#000;display:flex;flex-direction:column;position:relative;border-radius:18px;overflow:hidden;border:2px solid #222}
.header{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0;z-index:10}
.logo{font-weight:900;font-size:13px;display:flex;align-items:center;gap:6px}
.badge{font-size:9px;background:#00ff88;color:#000;padding:2px 6px;border-radius:4px;font-weight:800;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.view{flex:1;position:relative;background:#000;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#canvas{display:none}
.trans-box{position:absolute;left:8px;right:8px;bottom:62px;background:rgba(0,0,0,.9);border:1px solid #00ff88;border-radius:14px;padding:12px;backdrop-filter:blur(10px);max-height:180px;overflow-y:auto}
.detect-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:10px}
.detect-badge{background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:2px 6px;color:#888}
.detect-badge.auto{background:#00ff88;color:#000;border-color:#00ff88;font-weight:800}
.orig{font-size:11px;color:#888;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trans{font-size:16px;color:#fff;font-weight:800;line-height:1.4;word-break:break-all}
.controls{height:52px;display:flex;gap:5px;padding:5px;background:#1a1a1a;border-top:1px solid #2a2a2a;flex-shrink:0;z-index:10}
.ctrl{flex:1;background:#2a2a2a;border:0;color:#fff;padding:10px;border-radius:10px;font-weight:800;font-size:12px}
.ctrl.big{flex:1.5;background:#00ff88;color:#000;font-size:14px}
.status{height:20px;padding:0 10px;background:#000;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#666;flex-shrink:0}
.lang-row{display:flex;gap:4px;padding:6px;background:#0f0f0f;border-top:1px solid #222;flex-shrink:0;align-items:center}
.lang-row select{flex:1;background:#1e1e1e;color:#fff;border:1px solid #333;border-radius:8px;padding:8px;font-size:12px;font-weight:700}
.lang-row .label{font-size:10px;color:#00ff88;font-weight:800;white-space:nowrap}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.93);z-index:20;padding:18px}
.center b{color:#fff;font-size:18px}
.center p{color:#888;font-size:11px;text-align:center;line-height:1.4}
.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</head>
<body>
<div class="hud">
  <div class="header">
    <div class="logo"><span class="dot"></span> AUTO DETECT <span class="badge">V3 자동감지</span></div>
    <div style="font-size:9px;color:#00ff88">언어 자동 인식</div>
  </div>
  <div class="view" id="view">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="transBox" class="trans-box" style="display:none">
      <div class="detect-row">
        <span class="detect-badge auto">AUTO</span>
        <span id="detectLang" class="detect-badge">감지 중...</span>
        <span style="color:#555">→</span>
        <span id="targetBadge" class="detect-badge" style="color:#00ff88;border-color:#00ff88">한글</span>
      </div>
      <div class="orig" id="origText"></div>
      <div class="trans" id="transText"></div>
    </div>
    <div id="startScreen" class="center">
      <b>🤖 언어 자동감지 번역</b>
      <p>원본 언어를 선택할 필요 없어요!<br>카메라에 비추기만 하면<br><b style="color:#00ff88">영어/일어/중국어/태국어/아랍어 등<br>30개 언어를 자동으로 인식</b>해서<br>원하는 언어로 번역해줘요</p>
      <p style="background:#1a1a1a;padding:8px;border-radius:8px;border:1px solid #333">예) 영어 메뉴판 → 한글<br>일본어 간판 → 한글<br>태국어 팜플렛 → 한글<br>전부 자동!</p>
      <button onclick="startCam()" style="background:#00ff88;color:#000;border:0;padding:14px 24px;border-radius:12px;font-weight:900;width:100%;margin-top:6px">카메라 시작 (자동감지)</button>
    </div>
  </div>
  <div class="lang-row">
    <span class="label">번역할 언어:</span>
    <select id="toLang"></select>
    <select id="mode"><option value="auto">자동 2.5초</option><option value="fast">빠르게 1.5초</option><option value="manual">수동만</option></select>
  </div>
  <div class="controls">
    <button class="ctrl" onclick="captureAndTranslate()">📸 번역</button>
    <button class="ctrl big" id="autoBtn" onclick="toggleAuto()">⏸️ 자동 중지</button>
    <button class="ctrl" onclick="clearTrans()">지우기</button>
  </div>
  <div class="status"><span id="status">자동 감지 모드 - 원본 언어 선택 불필요</span><span>auto-detect</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const TARGETS = [
  {code:'ko', name:'한글', flag:'🇰🇷'},
  {code:'en', name:'영어', flag:'🇺🇸'},
  {code:'ja', name:'일본어', flag:'🇯🇵'},
  {code:'zh', name:'중국어', flag:'🇨🇳'},
  {code:'es', name:'스페인어', flag:'🇪🇸'},
  {code:'fr', name:'프랑스어', flag:'🇫🇷'},
  {code:'de', name:'독일어', flag:'🇩🇪'},
  {code:'th', name:'태국어', flag:'🇹🇭'},
  {code:'vi', name:'베트남어', flag:'🇻🇳'},
  {code:'id', name:'인도네시아어', flag:'🇮🇩'},
  {code:'ru', name:'러시아어', flag:'🇷🇺'},
  {code:'ar', name:'아랍어', flag:'🇸🇦'},
];

const toSel=document.getElementById('toLang');
TARGETS.forEach(l=>{ const o=document.createElement('option'); o.value=l.code; o.textContent=`${l.flag} ${l.name}`; toSel.appendChild(o); });
toSel.value='ko';

let stream=null, autoInterval=null, isAuto=true, worker=null, lastText='';

// 자동 감지용 멀티 언어 OCR - 가장 많이 쓰는 12개 언어를 동시에 로드
const AUTO_LANGS = 'eng+kor+jpn+chi_sim+chi_tra+spa+fra+deu+rus+ara+tha+vie';

async function initWorker(){
  document.getElementById('status').textContent='자동감지 OCR 엔진 로딩 중 (30MB)...';
  try{
    if(worker) await worker.terminate();
    worker = await Tesseract.createWorker(AUTO_LANGS);
    document.getElementById('status').textContent='자동감지 준비 완료 ✓ 12개 언어 동시 인식';
  }catch(e){
    document.getElementById('status').textContent='OCR 로딩 실패: '+e.message;
  }
}

async function startCam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:1280, height:720}, audio:false});
    document.getElementById('video').srcObject=stream;
    document.getElementById('startScreen').style.display='none';
    await initWorker();
    startAuto();
  }catch(e){ alert('카메라 권한 필요: '+e.message); }
}

function getIntervalMs(){ const m=document.getElementById('mode').value; if(m==='fast') return 1500; if(m==='manual') return 0; return 2500; }
function startAuto(){ const ms=getIntervalMs(); if(ms===0){ stopAuto(); return; } isAuto=true; document.getElementById('autoBtn').textContent='⏸️ 자동 중지'; if(autoInterval) clearInterval(autoInterval); autoInterval=setInterval(()=>{ if(isAuto) captureAndTranslate(); }, ms); }
function stopAuto(){ isAuto=false; document.getElementById('autoBtn').textContent='▶️ 자동 시작'; if(autoInterval) clearInterval(autoInterval); }
function toggleAuto(){ if(isAuto) stopAuto(); else startAuto(); }

function detectLangFlag(code){
  const map={en:'🇺🇸', ko:'🇰🇷', ja:'🇯🇵', zh:'🇨🇳', es:'🇪🇸', fr:'🇫🇷', de:'🇩🇪', ru:'🇷🇺', ar:'🇸🇦', th:'🇹🇭', vi:'🇻🇳', id:'🇮🇩', ko:'🇰🇷', 'zh-CN':'🇨🇳', 'zh-TW':'🇹🇼'};
  return map[code]||'🌐';
}
function langName(code){
  const map={en:'영어', ko:'한글', ja:'일본어', zh:'중국어', es:'스페인어', fr:'프랑스어', de:'독일어', ru:'러시아어', ar:'아랍어', th:'태국어', vi:'베트남어', id:'인도네시아어'};
  return map[code]||code;
}

async function captureAndTranslate(){
  const video=document.getElementById('video'); const canvas=document.getElementById('canvas');
  if(!video.videoWidth) return;
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  
  const target=toSel.value;
  const targetObj=TARGETS.find(t=>t.code===target);
  document.getElementById('targetBadge').textContent=targetObj.flag+' '+targetObj.name;
  document.getElementById('status').textContent='글자 인식 중... (자동 감지)';
  
  try{
    const {data:{text}} = await worker.recognize(canvas);
    const clean=text.trim().replace(/\n+/g,' ').slice(0,400);
    if(!clean || clean.length<2){ document.getElementById('status').textContent='텍스트 없음'; return; }
    if(clean===lastText) return;
    lastText=clean;
    
    document.getElementById('origText').textContent=clean.slice(0,120);
    document.getElementById('transBox').style.display='block';
    document.getElementById('transText').textContent='자동 감지 + 번역 중...';
    document.getElementById('detectLang').textContent='감지 중...';
    
    // Google translate auto-detect API - sl=auto 가 핵심
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&q=${encodeURIComponent(clean)}`;
    const res=await fetch(url);
    const data=await res.json();
    // data[0] is translations, data[2] is detected source language
    const translated = data[0]?.map(x=>x[0]).join('') || clean;
    const detectedLang = data[2] || 'auto';
    
    document.getElementById('detectLang').textContent=`${detectLangFlag(detectedLang)} ${langName(detectedLang)} 감지됨`;
    document.getElementById('transText').textContent=`${targetObj.flag} ${translated}`;
    document.getElementById('status').textContent=`자동감지: ${langName(detectedLang)} → ${targetObj.name} ✓`;
    
  }catch(e){
    document.getElementById('status').textContent='오류: '+e.message;
    // fallback to MyMemory if google fails
    try{
      const fallback=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(lastText)}&langpair=auto|${target}`);
      const json=await fallback.json();
      document.getElementById('transText').textContent=json.responseData?.translatedText||lastText;
    }catch(e2){}
  }
}

function clearTrans(){ document.getElementById('transBox').style.display='none'; lastText=''; document.getElementById('status').textContent='지워짐 - 다시 비추면 자동 감지'; }
document.getElementById('mode').addEventListener('change', ()=>{ if(isAuto) startAuto(); });
</script>
</body>
</html>
